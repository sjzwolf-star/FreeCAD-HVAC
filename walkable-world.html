<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>可走进去的 3D 世界 - Walkable World</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #87ceeb; font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
  canvas { display: block; }

  /* 开始/暂停遮罩 */
  #blocker {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 40%, rgba(20,30,48,0.55), rgba(10,15,25,0.85));
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    color: #fff; text-align: center;
    cursor: pointer; z-index: 10;
    transition: opacity .3s ease;
  }
  #blocker.hidden { opacity: 0; pointer-events: none; }
  #blocker h1 { font-size: 44px; margin: 0 0 8px; letter-spacing: 2px; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
  #blocker .sub { font-size: 16px; opacity: .85; margin-bottom: 28px; }
  #blocker .keys { display: grid; grid-template-columns: auto auto; gap: 10px 22px; font-size: 15px; background: rgba(255,255,255,.08); padding: 18px 26px; border-radius: 14px; backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.15); }
  #blocker .keys b { color: #ffd166; }
  #blocker .start { margin-top: 26px; font-size: 18px; padding: 12px 30px; border-radius: 999px; background: #ffd166; color: #1a1a1a; font-weight: 700; box-shadow: 0 6px 20px rgba(255,209,102,.35); }

  /* 准星 */
  #crosshair {
    position: absolute; left: 50%; top: 50%;
    width: 18px; height: 18px; transform: translate(-50%, -50%);
    pointer-events: none; z-index: 5; display: none;
  }
  #crosshair::before, #crosshair::after {
    content: ""; position: absolute; background: rgba(255,255,255,.85);
    box-shadow: 0 0 2px rgba(0,0,0,.6);
  }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }

  /* HUD 提示 */
  #hud {
    position: absolute; left: 14px; bottom: 14px;
    color: rgba(255,255,255,.8); font-size: 13px;
    background: rgba(0,0,0,.35); padding: 8px 12px; border-radius: 8px;
    z-index: 5; display: none; pointer-events: none;
  }
</style>
</head>
<body>

<div id="blocker">
  <h1>🌳 走进去的 3D 世界</h1>
  <div class="sub">一个用 three.js 搭建的可漫游庭院</div>
  <div class="keys">
    <div><b>W A S D</b></div><div>前后左右移动</div>
    <div><b>鼠标</b></div><div>转动视角</div>
    <div><b>空格</b></div><div>跳跃</div>
    <div><b>Shift</b></div><div>奔跑</div>
    <div><b>Esc</b></div><div>退出/暂停</div>
  </div>
  <div class="start">点击进入世界</div>
</div>

<div id="crosshair"></div>
<div id="hud">WASD 移动 · 鼠标视角 · 空格跳跃 · Shift 奔跑</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

/* ============================================================
 *  全局变量
 * ============================================================ */
let camera, scene, renderer, controls;
const colliders = [];            // 可碰撞物体的世界包围盒 (THREE.Box3)
let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
let canJump = false;
let isRunning = false;
let prevTime = performance.now();
const velocity = new THREE.Vector3();
const direction = new THREE.Vector3();

// 玩家参数
const EYE_HEIGHT = 1.7;          // 站立时眼睛高度
const PLAYER_RADIUS = 0.35;      // 碰撞半径
const GRAVITY = 28;              // 重力 (单位: m/s^2, 世界单位=米)
const JUMP_SPEED = 8.5;
const WALK_SPEED = 5.0;
const RUN_SPEED = 9.0;

/* ============================================================
 *  初始化
 * ============================================================ */
init();
animate();

function init() {
  // ---- 相机 ----
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, EYE_HEIGHT, 0);

  // ---- 场景 ----
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 30, 120);

  // ---- 光照 ----
  const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x4a6b3a, 0.9);
  hemi.position.set(0, 50, 0);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xfff4d6, 1.1);
  sun.position.set(30, 50, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 120;
  sun.shadow.camera.left = -60;
  sun.shadow.camera.right = 60;
  sun.shadow.camera.top = 60;
  sun.shadow.camera.bottom = -60;
  scene.add(sun);

  // ---- 控制器 (第一人称) ----
  controls = new PointerLockControls(camera, document.body);
  scene.add(controls.object);

  const blocker = document.getElementById('blocker');
  const crosshair = document.getElementById('crosshair');
  const hud = document.getElementById('hud');

  blocker.addEventListener('click', () => controls.lock());
  controls.addEventListener('lock', () => {
    blocker.classList.add('hidden');
    crosshair.style.display = 'block';
    hud.style.display = 'block';
  });
  controls.addEventListener('unlock', () => {
    blocker.classList.remove('hidden');
    crosshair.style.display = 'none';
    hud.style.display = 'none';
  });

  // ---- 键盘输入 ----
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('keyup', onKeyUp);

  // ---- 构建世界 ----
  buildGround();
  buildBoundaryWalls();
  buildBuildings();
  buildTrees();
  buildCrates();
  buildDecorations();

  // ---- 渲染器 ----
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  window.addEventListener('resize', onWindowResize);
}

/* ============================================================
 *  键盘
 * ============================================================ */
function onKeyDown(e) {
  switch (e.code) {
    case 'ArrowUp': case 'KeyW': moveForward = true; break;
    case 'ArrowDown': case 'KeyS': moveBackward = true; break;
    case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
    case 'ArrowRight': case 'KeyD': moveRight = true; break;
    case 'Space':
      if (canJump) { velocity.y = JUMP_SPEED; canJump = false; }
      break;
    case 'ShiftLeft': case 'ShiftRight': isRunning = true; break;
  }
}
function onKeyUp(e) {
  switch (e.code) {
    case 'ArrowUp': case 'KeyW': moveForward = false; break;
    case 'ArrowDown': case 'KeyS': moveBackward = false; break;
    case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
    case 'ArrowRight': case 'KeyD': moveRight = false; break;
    case 'ShiftLeft': case 'ShiftRight': isRunning = false; break;
  }
}

/* ============================================================
 *  碰撞辅助
 *  将 Mesh 的世界包围盒加入 colliders 列表
 * ============================================================ */
function addCollider(mesh) {
  mesh.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(mesh);
  colliders.push(box);
}

// 检查玩家 (圆柱) 在 (x,z) 是否与任何碰撞体重叠
function collidesAt(x, z) {
  const r = PLAYER_RADIUS;
  for (const box of colliders) {
    if (x + r > box.min.x && x - r < box.max.x &&
        z + r > box.min.z && z - r < box.max.z) {
      return true;
    }
  }
  return false;
}

/* ============================================================
 *  构建世界
 * ============================================================ */
function buildGround() {
  // 草地
  const geo = new THREE.PlaneGeometry(200, 200);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshLambertMaterial({ color: 0x5a8f3c });
  const ground = new THREE.Mesh(geo, mat);
  ground.receiveShadow = true;
  scene.add(ground);

  // 中央石板小路 (装饰, 不参与碰撞)
  const path = new THREE.Mesh(
    new THREE.PlaneGeometry(3, 40),
    new THREE.MeshLambertMaterial({ color: 0x9a9a9a })
  );
  path.rotation.x = -Math.PI / 2;
  path.position.set(0, 0.01, 0);
  path.receiveShadow = true;
  scene.add(path);
}

// 四周的围墙 (围成一个 60x60 的院子)
function buildBoundaryWalls() {
  const wallMat = new THREE.MeshLambertMaterial({ color: 0xb0a090 });
  const wallH = 4, wallT = 1, span = 60;

  // 四面墙
  const walls = [
    { w: span, h: wallH, d: wallT, x: 0, z: -span / 2 },          // 北
    { w: span, h: wallH, d: wallT, x: 0, z:  span / 2 },          // 南
    { w: wallT, h: wallH, d: span, x: -span / 2, z: 0 },          // 西
    { w: wallT, h: wallH, d: span, x:  span / 2, z: 0 },          // 东
  ];
  for (const w of walls) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w.w, w.h, w.d), wallMat);
    m.position.set(w.x, w.h / 2, w.z);
    m.castShadow = true; m.receiveShadow = true;
    scene.add(m);
    addCollider(m);
  }
}

// 几栋小房子
function buildBuildings() {
  const makeHouse = (x, z, w, d, h, color) => {
    // 主体
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshLambertMaterial({ color })
    );
    body.position.set(x, h / 2, z);
    body.castShadow = true; body.receiveShadow = true;
    scene.add(body);
    addCollider(body);

    // 屋顶 (四棱锥)
    const roof = new THREE.Mesh(
      new THREE.ConeGeometry(Math.max(w, d) * 0.78, 2.2, 4),
      new THREE.MeshLambertMaterial({ color: 0x8b3a2b })
    );
    roof.position.set(x, h + 1.1, z);
    roof.rotation.y = Math.PI / 4;
    roof.castShadow = true;
    scene.add(roof);

    // 门
    const door = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 2.2, 0.1),
      new THREE.MeshLambertMaterial({ color: 0x4a2c1a })
    );
    door.position.set(x, 1.1, z + d / 2 + 0.06);
    scene.add(door);

    // 窗户
    const winMat = new THREE.MeshLambertMaterial({ color: 0xffe8a0, emissive: 0x443300 });
    const win1 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.1), winMat);
    win1.position.set(x - w / 3, h / 2, z + d / 2 + 0.06);
    scene.add(win1);
    const win2 = win1.clone();
    win2.position.x = x + w / 3;
    scene.add(win2);
  };

  makeHouse(-18, -15, 8, 7, 4.5, 0xd9c7a3);
  makeHouse(16, -12, 7, 6, 4, 0xe0c9a8);
  makeHouse(-14, 16, 6, 8, 5, 0xc9b79a);
  makeHouse(18, 18, 9, 7, 4.5, 0xd4b896);
}

// 树木
function buildTrees() {
  const makeTree = (x, z, scale = 1) => {
    const trunkH = 2.5 * scale;
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.25 * scale, 0.35 * scale, trunkH, 8),
      new THREE.MeshLambertMaterial({ color: 0x6b4423 })
    );
    trunk.position.set(x, trunkH / 2, z);
    trunk.castShadow = true;
    scene.add(trunk);
    addCollider(trunk);

    const leafColor = [0x3f7d3a, 0x4f9a45, 0x2f6b2a][Math.floor(Math.random() * 3)];
    const leaves = new THREE.Mesh(
      new THREE.ConeGeometry(1.6 * scale, 3 * scale, 8),
      new THREE.MeshLambertMaterial({ color: leafColor })
    );
    leaves.position.set(x, trunkH + 1.2 * scale, z);
    leaves.castShadow = true;
    scene.add(leaves);

    const leaves2 = new THREE.Mesh(
      new THREE.ConeGeometry(1.2 * scale, 2.4 * scale, 8),
      new THREE.MeshLambertMaterial({ color: leafColor })
    );
    leaves2.position.set(x, trunkH + 2.8 * scale, z);
    leaves2.castShadow = true;
    scene.add(leaves2);
  };

  const spots = [
    [-8, -8], [10, -6], [-22, 2], [22, 4], [-6, 10], [8, 12],
    [-25, -22], [24, -24], [25, 22], [-24, 24], [0, -25], [0, 25]
  ];
  spots.forEach(([x, z]) => makeTree(x, z, 0.9 + Math.random() * 0.5));
}

// 木箱 (可跳过的小障碍)
function buildCrates() {
  const crateMat = new THREE.MeshLambertMaterial({ color: 0x9c6b3f });
  const spots = [[3, -3], [5, 5], [-4, 8], [-9, 3], [12, 2]];
  for (const [x, z] of spots) {
    const size = 1.0;
    const c = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), crateMat);
    c.position.set(x, size / 2, z);
    c.castShadow = true; c.receiveShadow = true;
    scene.add(c);
    addCollider(c);
  }
}

// 装饰: 石灯笼 + 花丛
function buildDecorations() {
  // 石灯笼
  const makeLantern = (x, z) => {
    const base = new THREE.Mesh(
      new THREE.CylinderGeometry(0.4, 0.5, 0.3, 8),
      new THREE.MeshLambertMaterial({ color: 0x888888 })
    );
    base.position.set(x, 0.15, z); base.castShadow = true; scene.add(base);

    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.12, 1.0, 8),
      new THREE.MeshLambertMaterial({ color: 0x999999 })
    );
    pole.position.set(x, 0.8, z); pole.castShadow = true; scene.add(pole);

    const top = new THREE.Mesh(
      new THREE.BoxGeometry(0.7, 0.5, 0.7),
      new THREE.MeshLambertMaterial({ color: 0xaaaaaa, emissive: 0x553300 })
    );
    top.position.set(x, 1.55, z); top.castShadow = true; scene.add(top);

    // 发光
    const light = new THREE.PointLight(0xffcc66, 0.8, 8);
    light.position.set(x, 1.6, z);
    scene.add(light);
  };
  makeLantern(-3, -3);
  makeLantern(3, 3);

  // 花丛 (几个彩色小球)
  const flowerColors = [0xff6b9d, 0xffd93d, 0xffffff, 0xc77dff];
  for (let i = 0; i < 40; i++) {
    const x = (Math.random() - 0.5) * 50;
    const z = (Math.random() - 0.5) * 50;
    if (Math.abs(x) < 1.8) continue; // 避开小路
    const f = new THREE.Mesh(
      new THREE.SphereGeometry(0.15, 6, 6),
      new THREE.MeshLambertMaterial({ color: flowerColors[i % flowerColors.length] })
    );
    f.position.set(x, 0.25, z);
    scene.add(f);
  }
}

/* ============================================================
 *  主循环
 * ============================================================ */
function animate() {
  requestAnimationFrame(animate);

  const time = performance.now();
  const delta = Math.min((time - prevTime) / 1000, 0.05); // 防止切后台后大跳
  prevTime = time;

  if (controls.isLocked) {
    // 速度衰减 (水平方向)
    const damping = 10.0;
    velocity.x -= velocity.x * damping * delta;
    velocity.z -= velocity.z * damping * delta;

    // 重力
    velocity.y -= GRAVITY * delta;

    // 输入方向
    direction.z = Number(moveForward) - Number(moveBackward);
    direction.x = Number(moveRight) - Number(moveLeft);
    direction.normalize();

    const speed = isRunning ? RUN_SPEED : WALK_SPEED;
    if (moveForward || moveBackward) velocity.z -= direction.z * speed * damping * delta;
    if (moveLeft || moveRight)     velocity.x -= direction.x * speed * damping * delta;

    // ---- 水平移动 + 碰撞 (分轴检测, 实现沿墙滑动) ----
    const pos = controls.object.position;
    const dx = -velocity.x * delta;
    const dz = -velocity.z * delta;

    // X 轴
    const tryX = pos.x + dx;
    if (!collidesAt(tryX, pos.z)) pos.x = tryX;
    else velocity.x = 0;

    // Z 轴
    const tryZ = pos.z + dz;
    if (!collidesAt(pos.x, tryZ)) pos.z = tryZ;
    else velocity.z = 0;

    // 把玩家限制在院子内 (作为围墙碰撞的后备)
    const half = 30 - PLAYER_RADIUS;
    pos.x = Math.max(-half, Math.min(half, pos.x));
    pos.z = Math.max(-half, Math.min(half, pos.z));

    // ---- 垂直移动 (重力 / 跳跃) ----
    pos.y += velocity.y * delta;
    if (pos.y < EYE_HEIGHT) {
      pos.y = EYE_HEIGHT;
      velocity.y = 0;
      canJump = true;
    }
  }

  renderer.render(scene, camera);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
</script>
</body>
</html>
